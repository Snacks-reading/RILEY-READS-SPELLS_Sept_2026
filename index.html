function state(){let s=load();s.baseline=s.baseline||{done:false,index:0,items:CORE,answers:[],confirm:[],phase:'core'};s.progress=s.progress||{seen:{},missed:{},daily:{},weeklyHistory:[],deep:0,vocab:0,writing:0};s.weekly=s.weekly||{word:'significant',pron:'sig-NIF-ih-kunt',pos:'adjective',definition:'important enough to matter or have an effect',sentence:'The broken watch becomes significant later in the story.'};save(s);return s}

function norm(x){return (x||'').trim().replace(/[’‘]/g,"'")}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function likelyError(expected,got){if(!got)return 'unknown / not yet encoded';if(expected.toLowerCase()===got.toLowerCase()&&expected!==got)return 'capitalization';if(expected.replace(/'/g,'')===got.replace(/'/g,''))return 'apostrophe';let e=expected.toLowerCase(),g=got.toLowerCase();if(e.includes('ied')&&g.includes('yed'))return 'y-to-i ending change';if(/([bcdfghjklmnpqrstvwxyz])\1/.test(e)&&!g.includes(RegExp.$1+RegExp.$1))return 'consonant doubling';if(Math.abs(e.length-g.length)>=3)return 'omitted or added syllable/segment';if(/[aeiou]/.test(e)&&/[aeiou]/.test(g))return 'vowel pattern';return 'consonant/letter pattern'}
function baselineDone(){return !!state().baseline.done}
function profile(){let s=state(), a=s.baseline.answers||[], ds={};for(const d of [...new Set(CORE.map(x=>x.domain))]){let z=a.filter(x=>x.domain===d),right=z.filter(x=>x.correct).length,total=z.length;ds[d]={right,total,status:total>=3?(right>=3?'Secure':right===2?'Developing':'Needs Instruction'):'Unplaced'}}return ds}
function weeklyDue(){let d=new Date().getDay();return d>=1&&d<=5}
function makePlan(){let s=state(), day=nowDay(), rec=s.progress.daily[day];if(rec&&rec.plan)return rec.plan;let p=[{id:'spell',title:'Targeted Spelling',desc:'24 adaptive items from current gaps, comeback words, transfer words, and Weekly Word.',minutes:16}]; if(weeklyDue())p.push({id:'vocab',title:'Word Range + Weekly Word',desc:'Use stronger vocabulary independently, not just recognize it.',minutes:5});let n=new Date().getDay(); if(n%2===0)p.push({id:'deep',title:'Deep Reading',desc:'Move from what happened to inference, theme, evidence, and explanation.',minutes:8});else p.push({id:'writing',title:'Writing Transfer',desc:'Turn understanding into precise written language.',minutes:7});s.progress.daily[day]={plan:p,done:[],current:0};save(s);return p}
function dailyRec(){let s=state();makePlan();return state().progress.daily[nowDay()]}
function routeHome(){renderHome()}
function renderHome(){let s=state(), app=document.querySelector('#app');if(!s.baseline.done){app.innerHTML=`<section class="hero"><div class="eyebrow">START HERE • ONE-TIME PLACEMENT</div><h1>Enter the Spelling Observatory</h1><p class="lead">Riley starts with one adaptive baseline. It identifies the spelling patterns she knows, the ones that are developing, and the gaps that need direct instruction. After this, the app chooses what comes next.</p><button class="primary" id="go">Take Your Baseline</button><div class="steps"><div class="step current"><div class="num">1</div><div><b>Baseline Observatory</b><div class="meta">36 core probes + confirmation only where needed</div></div><div class="meta">First use</div></div><div class="step"><div class="num">2</div><div><b>Personal Gap Plan</b><div class="meta">Built automatically from her results</div></div><div class="meta">Locked</div></div><div class="step"><div class="num">3</div><div><b>Daily Learning Path</b><div class="meta">One Continue button. No menu decisions.</div></div><div class="meta">Locked</div></div></div></section>`;document.querySelector('#go').onclick=renderBaseline;return}
let rec=dailyRec(), plan=rec.plan, done=rec.done||[], idx=plan.findIndex(x=>!done.includes(x.id));let complete=idx<0, mins=plan.filter(x=>!done.includes(x.id)).reduce((a,b)=>a+b.minutes,0);app.innerHTML=`<section class="hero"><div class="eyebrow">RILEY’S FOCUSED LEARNING PATH</div><h1>${complete?'Today’s path is complete.':'Welcome back, Riley.'}</h1><p class="lead">${complete?'Your work is saved. Come back tomorrow for the next focused path.':`${plan.length-done.length} activities left · about ${mins} minutes. Press Continue and the app will take you through the work in order.`}</p>${complete?'<button class="primary" id="go">View Progress</button>':'<button class="primary" id="go">Continue Today’s Path</button>'}<div class="steps">${plan.map((x,i)=>`<div class="step ${done.includes(x.id)?'done':''} ${i===idx?'current':''}"><div class="num">${done.includes(x.id)?'✓':i+1}</div><div><b>${x.title}</b><div class="meta">${x.desc}</div></div><div class="meta">${done.includes(x.id)?'Complete':x.minutes+' min'}</div></div>`).join('')}</div><div style="margin-top:20px"><button class="parentlink" id="parent">Parent / Tutor Progress</button></div></section>`;document.querySelector('#go').onclick=()=>complete?renderParent():startActivity(plan[idx].id);document.querySelector('#parent').onclick=renderParent}
function renderBaseline(){let s=state(),b=s.baseline, items=b.phase==='core'?CORE:b.confirm;if(b.phase==='confirm'&&items.length===0){finishBaseline();return}if(b.index>=items.length){if(b.phase==='core'){let by={};b.answers.forEach(a=>(by[a.domain]??=[]).push(a));let needs=[];for(const [d,a] of Object.entries(by)){let r=a.filter(x=>x.correct).length;if(r===2)needs.push(...CONFIRM.filter(x=>x.domain===d).slice(0,1));else if(r<=1)needs.push(...CONFIRM.filter(x=>x.domain===d).slice(0,2))}b.phase='confirm';b.confirm=needs;b.index=0;save(s);if(!needs.length)return finishBaseline();return renderBaseline()}return finishBaseline()}
let it=items[b.index], total=CORE.length+(b.confirm?.length||0), done=(b.phase==='core'?b.index:CORE.length+b.index);document.querySelector('#app').innerHTML=`<section class="card"><div class="spread"><div><div class="eyebrow">SPELLING OBSERVATORY</div><h2>${b.phase==='core'?'Baseline':'Confirmation Round'}</h2></div><span class="tag">${done+1} of ${total}</span></div><div class="progress"><div class="bar" style="width:${Math.round(done/Math.max(total,1)*100)}%"></div></div><p class="lead">Listen to the sentence, then spell the word. No hints or teaching during the baseline. Capitalization counts.</p><div class="row"><button class="ghost" id="hear">🔊 Hear sentence + word</button></div><input class="answer" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the word you hear"><div class="row" style="margin-top:12px"><button class="primary" id="submit">Submit</button><button class="ghost" id="idk">I don’t know yet</button></div><div class="feedback" id="fb"></div></section>`;let say=()=>{speak(it.sentence);setTimeout(()=>speak('Spell '+it.word),Math.min(3800,900+it.sentence.length*45))};document.querySelector('#hear').onclick=say;setTimeout(say,300);let submit=(idk=false)=>{let got=idk?'':norm(document.querySelector('#ans').value), correct=got===it.word;b.answers.push({word:it.word,got,correct,domain:it.domain,error:correct?'':likelyError(it.word,got)});b.index++;save(s);renderBaseline()};document.querySelector('#submit').onclick=()=>submit(false);document.querySelector('#idk').onclick=()=>submit(true);document.querySelector('#ans').onkeydown=e=>{if(e.key==='Enter')submit(false)};document.querySelector('#ans').focus()}
function finishBaseline(){let s=state();s.baseline.done=true;s.baseline.completedAt=new Date().toISOString();save(s);let p=profile(), gaps=Object.entries(p).filter(([d,x])=>x.status!=='Secure').map(([d])=>d);document.querySelector('#app').innerHTML=`<section class="hero"><div class="eyebrow">BASELINE COMPLETE</div><h1>Your learning path is ready.</h1><p class="lead">The app will now prioritize ${gaps.length?esc(gaps.slice(0,3).join(', ')):'transfer and retention'} and keep checking unfamiliar words before calling a skill secure.</p><button class="primary" id="go">Start Today’s Path</button></section>`;document.querySelector('#go').onclick=renderHome}
function buildMission(){let s=state(),day=nowDay(),key='mission_'+day;if(s.progress.daily[day]?.mission)return s.progress.daily[day].mission;let prof=profile(), pri=Object.entries(prof).filter(([d,x])=>x.status==='Needs Instruction').map(([d])=>d), dev=Object.entries(prof).filter(([d,x])=>x.status==='Developing').map(([d])=>d);if(!pri.length)pri=Object.keys(prof).slice(0,3);if(!dev.length)dev=Object.keys(prof).slice(3,6);let seen=s.progress.seen||{}, missed=s.progress.missed||{};let pool=(ds)=>BANK.filter(x=>ds.includes(x.domain));let pick=(arr,n,avoid=new Set())=>{let a=[...arr].sort((x,y)=>(seen[x.word]||0)-(seen[y.word]||0)||Math.random()-.5),o=[];for(let x of a)if(!avoid.has(x.word)&&o.push(x)&&o.length===n)break;return o};let out=[],used=new Set();for(let [arr,n,type] of [[pool(pri),8,'priority'],[pool(dev),4,'secondary']])for(let x of pick(arr,n,used)){used.add(x.word);out.push({...x,type})}let comeback=Object.keys(missed).sort((a,b)=>(missed[b].count||0)-(missed[a].count||0)).map(w=>BANK.find(x=>x.word===w)).filter(Boolean);for(let x of pick(comeback,4,used)){used.add(x.word);out.push({...x,type:'comeback'})}for(let x of pick(BANK,4,used)){used.add(x.word);out.push({...x,type:'spiral'})}for(let x of pick(BANK.filter(x=>!seen[x.word]),2,used)){used.add(x.word);out.push({...x,type:'transfer'})}let wk=s.weekly;if(wk&&!used.has(wk.word)){out.push({word:wk.word,sentence:wk.sentence,domain:'Weekly Word',type:'weekly'});used.add(wk.word)}let caps=BANK.filter(x=>/^[A-Z]/.test(x.word));for(let x of pick(caps,2,used)){used.add(x.word);out.push({...x,type:'capitalization'})}for(let x of pick(BANK,24-out.length,used)){used.add(x.word);out.push({...x,type:'spiral'})}out=out.slice(0,24);s.progress.daily[day].mission={items:out,index:0,attempts:0,correct:0};save(s);return out}
function startActivity(id){if(id==='spell')renderSpelling();else if(id==='vocab')renderVocab();else if(id==='deep')renderDeep();else renderWriting()}
function markDone(id){let s=state(),r=s.progress.daily[nowDay()];if(!r.done.includes(id))r.done.push(id);save(s);renderActivityComplete(id)}
function renderActivityComplete(id){let rec=dailyRec(),next=rec.plan.find(x=>!rec.done.includes(x.id));document.querySelector('#app').innerHTML=`<section class="hero"><div class="eyebrow">ACTIVITY COMPLETE</div><h1 class="complete">Nice work.</h1><p class="lead">${next?`Next: ${esc(next.title)}. Riley does not need to choose what to practice.`:'You finished today’s focused learning path.'}</p><button class="primary" id="next">${next?'Continue to Next Activity':'Finish Today’s Path'}</button></section>`;document.querySelector('#next').onclick=()=>next?startActivity(next.id):renderHome()}
function renderSpelling(){let s=state(),m=s.progress.daily[nowDay()].mission||null;if(!m){buildMission();s=state();m=s.progress.daily[nowDay()].mission}if(m.index>=m.items.length)return markDone('spell');let it=m.items[m.index],attempt=m.attempts||0;document.querySelector('#app').innerHTML=`<section class="card"><div class="spread"><div><div class="eyebrow">TODAY’S PATH • TARGETED SPELLING</div><h2>Item ${m.index+1} of ${m.items.length}</h2></div><span class="tag">${esc(it.type)}</span></div><div class="progress"><div class="bar" style="width:${Math.round(m.index/m.items.length*100)}%"></div></div><p class="prompt">Listen first. The target word stays hidden.</p><button class="ghost" id="hear">🔊 Hear sentence + word</button><input class="answer" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Spell the word"><button class="primary" id="check" style="margin-top:12px">Check</button><div class="feedback" id="fb"></div></section>`;let say=(slow=false)=>{speak(it.sentence,slow?.72:.86);setTimeout(()=>speak('Spell '+it.word,slow?.66:.82),Math.min(3600,900+it.sentence.length*42))};document.querySelector('#hear').onclick=()=>say(false);setTimeout(()=>say(false),250);let check=()=>{let ss=state(),mm=ss.progress.daily[nowDay()].mission,got=norm(document.querySelector('#ans').value),first=mm.attempts===0;ss.progress.seen[it.word]=(ss.progress.seen[it.word]||0)+1;if(got===it.word){if(first)mm.correct++;document.querySelector('#fb').innerHTML='<span class="good">Correct.</span> Moving on…';mm.index++;mm.attempts=0;save(ss);speak('Correct.');setTimeout(renderSpelling,700);return}mm.attempts=(mm.attempts||0)+1;let miss=ss.progress.missed[it.word]||{count:0};miss.count++;miss.last=Date.now();miss.error=likelyError(it.word,got);ss.progress.missed[it.word]=miss;save(ss);if(mm.attempts===1){document.querySelector('#fb').innerHTML='<span class="bad">Not yet.</span> Try once more. The answer stays hidden.';document.querySelector('#ans').value='';document.querySelector('#ans').focus()}else if(mm.attempts===2){document.querySelector('#fb').innerHTML='<span class="bad">Listen again.</span> I’ll say the word more slowly and repeat the sentence.';document.querySelector('#ans').value='';say(true);document.querySelector('#ans').focus()}else{document.querySelector('#fb').innerHTML=`<span class="bad">Correct spelling: ${esc(it.word)}</span><br>Likely pattern to repair: ${esc(miss.error)}. Type it correctly once. It will return in comeback practice.`;document.querySelector('#ans').value=it.word;document.querySelector('#ans').disabled=true;mm.index++;mm.attempts=0;save(ss);speak('The correct spelling is '+it.word);setTimeout(renderSpelling,2300)}};document.querySelector('#check').onclick=check;document.querySelector('#ans').onkeydown=e=>{if(e.key==='Enter')check()};document.querySelector('#ans').focus()}
function renderVocab(){let s=state(),w=s.weekly;document.querySelector('#app').innerHTML=`<section class="card"><div class="eyebrow">TODAY’S PATH • WORD RANGE</div><h2>Use stronger words independently</h2><p class="lead">Weekly Word: <b>${esc(w.word)}</b> (${esc(w.pos)}) — ${esc(w.definition)}.</p><p class="prompt">Replace the general word in this sentence with a more precise word:<br><br>“The discovery was <u>important</u> because it changed what the researchers believed.”</p><input class="answer" id="v" placeholder="Type one stronger word"><div class="feedback" id="fb"></div><button class="primary" id="go">Check my word</button></section>`;document.querySelector('#go').onclick=()=>{let v=norm(document.querySelector('#v').value).toLowerCase(),ok=['significant','crucial','essential','meaningful','consequential','important'].includes(v);if(!v)return;document.querySelector('#fb').innerHTML=ok?'<span class="good">Good. Now use it in your own sentence.</span>':'Try a word that means important enough to matter. Think about this week’s word.';if(ok){s.progress.vocab++;save(s);setTimeout(()=>markDone('vocab'),1200)}}}
function renderDeep(){let s=state(),p=PASSAGES[s.progress.deep%PASSAGES.length];document.querySelector('#app').innerHTML=`<section class="card"><div class="eyebrow">TODAY’S PATH • DEEP READING</div><h2>${esc(p.title)}</h2><p class="lead" style="color:#eef0fb">${esc(p.text)}</p><p class="prompt">${esc(p.q)}</p><textarea class="answer" id="d" placeholder="Answer with a complete idea. Explain why it matters."></textarea><div class="feedback" id="fb"></div><button class="primary" id="go">Check depth</button></section>`;document.querySelector('#go').onclick=()=>{let t=norm(document.querySelector('#d').value);if(t.split(/\s+/).length<12){document.querySelector('#fb').textContent='Go deeper. Explain what the detail suggests—not only what happened.';return}document.querySelector('#fb').innerHTML=`<span class="good">Good depth check.</span><br>A strong interpretation could connect to: ${esc(p.theme)}<br><span class="tiny">Evidence model: ${esc(p.evidence)}</span>`;s.progress.deep++;save(s);setTimeout(()=>markDone('deep'),2600)}}
function renderWriting(){let s=state();document.querySelector('#app').innerHTML=`<section class="card"><div class="eyebrow">TODAY’S PATH • WRITING TRANSFER</div><h2>Turn understanding into precise writing</h2><p class="prompt">Write 3–4 sentences explaining why revision can improve an idea. Use the word <b>${esc(s.weekly.word)}</b> naturally, include one specific example, and check spelling/capitalization.</p><textarea class="answer" id="w" placeholder="Write your response here…"></textarea><div class="feedback" id="fb"></div><button class="primary" id="go">Review my response</button></section>`;document.querySelector('#go').onclick=()=>{let t=norm(document.querySelector('#w').value),words=t.split(/\s+/).filter(Boolean),sent=(t.match(/[.!?]+/g)||[]).length,has=t.toLowerCase().includes(s.weekly.word.toLowerCase());let issues=[];if(words.length<35)issues.push('develop the explanation with more detail');if(sent<3)issues.push('write at least 3 complete sentences');if(!has)issues.push('use the Weekly Word naturally');if(!/^[A-Z]/.test(t))issues.push('begin with a capital letter');if(issues.length){document.querySelector('#fb').innerHTML='<span class="bad">Revise before finishing:</span> '+esc(issues.join('; '))+'.';return}document.querySelector('#fb').innerHTML='<span class="good">Transfer complete.</span> You explained an idea, used precise vocabulary, and checked conventions.';s.progress.writing++;save(s);setTimeout(()=>markDone('writing'),1600)}}
function renderParent(){let s=state(),p=profile(),miss=Object.entries(s.progress.missed||{}).sort((a,b)=>(b[1].count||0)-(a[1].count||0)).slice(0,8);document.querySelector('#app').innerHTML=`<section class="hero"><div class="eyebrow">PARENT / TUTOR VIEW</div><h1>Gap-Elimination Progress</h1><p class="lead">Riley’s benchmark pattern: strong reading comprehension with spelling as the clearest measured relative weakness. The learner screen intentionally hides menus; this view exposes the underlying plan.</p><div class="grid"><div class="metric"><b>78th</b>Reading comprehension<br><span class="tiny">well above average</span></div><div class="metric"><b>75th</b>Overall reading<br><span class="tiny">well above average</span></div><div class="metric"><b>61st</b>Silent reading fluency</div><div class="metric"><b>61st</b>Writing fluency</div><div class="metric"><b>50th</b>Vocabulary<br><span class="tiny">average</span></div><div class="metric"><b>32nd</b>Spelling<br><span class="tiny">priority gap</span></div></div><div class="card"><h2>Spelling domains</h2>${Object.entries(p).map(([d,x])=>`<div class="spread" style="padding:7px 0;border-bottom:1px solid #28325c"><span>${esc(d)}</span><span class="tag">${esc(x.status)}</span></div>`).join('')||'<p>Baseline not completed yet.</p>'}</div><div class="card"><h2>Repeated problem words</h2><p>${miss.length?miss.map(([w,x])=>`${esc(w)} (${x.count})`).join(' • '):'No repeated misses recorded yet.'}</p><p class="tiny">Mastery is based on first-attempt accuracy, unfamiliar transfer, later retention, and capitalization—not simply completing a lesson.</p></div><div class="row"><button class="ghost" id="back">Back to Riley’s Home</button><button class="ghost" id="resetDay">Reset Today’s Path</button></div></section>`;document.querySelector('#back').onclick=renderHome;document.querySelector('#resetDay').onclick=()=>{let ss=state();delete ss.progress.daily[nowDay()];save(ss);renderHome()}}
document.querySelector('#homeBtn').onclick=renderHome;renderHome();
</script></body></html>
