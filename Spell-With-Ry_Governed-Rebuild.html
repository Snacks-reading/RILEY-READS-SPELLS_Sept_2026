 <div class="card"><h2>🪄 The rule</h2><p style="font-size:1.25rem">${esc(l.rule)}</p><p class="muted">Study the examples, then prove the rule on words you have not simply memorized.</p></div>
 <div class="grid"><div class="tile"><b>Repair words</b><p>${l.words.map(esc).join(' · ')}</p></div><div class="tile"><b>Transfer words</b><p>${l.transfer.map(esc).join(' · ')}</p></div></div>
 <div class="row" style="margin-top:18px"><button class="primary" onclick="startPractice(${i})">Practice Now</button><button class="ghost" onclick="speak('${esc(l.rule)}',.76)">🔊 Hear the Rule</button></div></section>`;
}
function startPractice(i){
 let l=S.path[i], items=[];
 // Format variety: dictation, MC error analysis, transfer spelling, meaning/editing.
 items.push({type:'dictation',word:l.words[0],sentence:`Spell ${l.words[0]} carefully using today's rule.`});
 items.push({type:'mc',word:l.words[1]||l.words[0]});
 items.push({type:'transfer',word:l.transfer[0],sentence:`Use the rule to spell the unfamiliar transfer word ${l.transfer[0]}.`});
 items.push({type:'dictation',word:l.words[2]||l.words[0],sentence:`Listen for every part of the word.`});
 items.push({type:'mc',word:l.transfer[1]||l.transfer[0]});
 S.queue=items;S.qIndex=0;S.session={lesson:i,firstCorrect:0,total:items.length,misses:[]};save(S);renderQ();
}
function misspell(w){
 if(w.length<5)return w+'e';
 let a=w.split(''); let k=Math.max(1,Math.floor(w.length/2)); a.splice(k,1); return a.join('');
}
function renderQ(){
 let q=S.queue[S.qIndex]; if(!q)return finishPractice();
 let l=S.path[S.session.lesson], pct=Math.round(S.qIndex/S.queue.length*100);
 if(q.type==='mc'){
   let bad1=misspell(q.word),bad2=q.word.replace(/i/g,'e'),bad3=q.word.replace(/e/g,'a'); let d=[...new Set([bad1,bad2,bad3,q.word+'e'])].filter(x=>x!==q.word).slice(0,3);
   while(d.length<3)d.push(q.word.slice(0,-1)+String.fromCharCode(97+d.length));
   let g=governedChoices(q.word,d,`${l.code}-${S.qIndex}`);
   $('#app').innerHTML=`<section class="card"><div class="spread"><div><div class="eyebrow">${l.code} • ERROR ANALYSIS</div><h2>Which spelling is correct?</h2></div><span class="tag">${S.qIndex+1}/${S.queue.length}</span></div><div class="progress"><div class="bar" style="width:${pct}%"></div></div>
   <p class="lead">Choose carefully. The correct-answer position is controlled so no letter becomes a clue.</p>${g.opts.map((x,j)=>`<button class="choice" onclick="answerMC(${j},${g.pos},'${esc(q.word)}')">${'ABCD'[j]}. ${esc(x)}</button>`).join('')}<div id="fb"></div></section>`;
 } else {
   $('#app').innerHTML=`<section class="card"><div class="spread"><div><div class="eyebrow">${l.code} • ${q.type==='transfer'?'UNFAMILIAR TRANSFER':'RETRIEVAL'}</div><h2>${q.type==='transfer'?'Prove the rule transfers':'Spell from memory'}</h2></div><span class="tag">${S.qIndex+1}/${S.queue.length}</span></div><div class="progress"><div class="bar" style="width:${pct}%"></div></div>
   <p class="lead">Listen first. The target stays hidden.</p><button class="ghost" id="hear">🔊 Hear sentence + word</button><input class="answer" id="ans" spellcheck="false" autocomplete="off" placeholder="Type the word"><button class="primary" id="check" style="margin-top:12px">Check</button><div id="fb" class="muted"></div></section>`;
   let say=()=>{speak(q.sentence);setTimeout(()=>speak('Spell '+q.word,.74),1200)};$('#hear').onclick=say;setTimeout(say,250);$('#check').onclick=()=>answerTyped(q.word);$('#ans').onkeydown=e=>{if(e.key==='Enter')answerTyped(q.word)};$('#ans').focus();
 }
}
function answerMC(j,pos,w){let ok=j===pos;if(ok)S.session.firstCorrect++;else S.session.misses.push(w);S.history.push({word:w,ok,when:Date.now(),format:'mc'});S.qIndex++;save(S);setTimeout(renderQ,250)}
function answerTyped(w){let got=$('#ans').value.trim(),ok=got===w;if(ok){S.session.firstCorrect++;S.history.push({word:w,ok:true,when:Date.now(),format:'typed'});S.qIndex++;save(S);renderQ()}else{$('#fb').innerHTML='<span class="bad">Not yet.</span> Listen, map the parts, and try once more.';S.session.misses.push(w);S.history.push({word:w,got,ok:false,when:Date.now(),format:'typed'});save(S);$('#ans').value='';}}
function finishPractice(){
 let i=S.session.lesson,l=S.path[i],rate=S.session.firstCorrect/S.session.total, transfer=S.history.filter(x=>x.word===l.transfer[0]).slice(-1)[0]?.ok;
 let m=S.mastery[l.code]||{sessions:0};m.sessions++;m.lastAccuracy=rate;m.transferPassed=!!transfer;m.secure=rate>=.8&&transfer&&m.sessions>=2;m.nextReview=Date.now()+2*86400000;S.mastery[l.code]=m;
 if(i<S.path.length-1 && rate>=.6)S.currentLesson=Math.max(S.currentLesson,i+1);save(S);
 $('#app').innerHTML=`<section class="hero"><div class="eyebrow">SESSION COMPLETE • NOT AUTOMATIC MASTERY</div><h1>${Math.round(rate*100)}% first-attempt accuracy</h1><p class="lead">${m.secure?'This skill has met the current mastery gate. It will still return in spiral review.':'Good data. This skill stays active until Riley shows strong first-attempt accuracy, unfamiliar transfer, and delayed retention.'}</p><button class="primary" onclick="home()">Return to My Path</button></section>`;
}
function parentView(){
 let rows=S.diagnosticMisses.map(x=>`<tr><td>${esc(x.word)}</td><td>${esc(x.got||'—')}</td><td>${esc(x.diagnosis)}</td></tr>`).join('');
 $('#app').innerHTML=`<section class="hero"><div class="eyebrow">PARENT / TUTOR • GOVERNED VIEW</div><h1>Riley's preserved diagnostic</h1><p class="lead">This rebuild uses Riley's recovered completed baseline as the source of truth. Legacy catch-all error labels have been reclassified into instructionally useful categories.</p>
 <div class="grid"><div class="tile"><b>Baseline</b><h3>Complete</h3></div><div class="tile"><b>Responses</b><h3>${S.baseline.answers.length}</h3></div><div class="tile"><b>Instructional path</b><h3>${S.path.length} priority modules</h3></div></div></section>
 <section class="card"><h2>Diagnostic misses</h2><div style="overflow:auto"><table><thead><tr><th>Target</th><th>Riley wrote</th><th>Reclassified instructional signal</th></tr></thead><tbody>${rows}</tbody></table></div></section>
 <section class="card"><h2>Release governance</h2><p class="muted">Correct-answer positions are actively balanced across A/B/C/D; formats vary; transfer words are required; first-attempt accuracy is separated from corrected performance; completion ≠ mastery; delayed review is retained; baseline cannot be overwritten by ordinary practice.</p>
 <button class="ghost" onclick="home()">Back</button></section>`;
}
home();
</script></body></html>
